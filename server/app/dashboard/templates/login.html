<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Browser Monitor Login</title>
  <style>
    :root { color-scheme: light dark; --bg: #f7f8fa; --panel: #ffffff; --line: #d5d9e2; --text: #1c2430; --accent: #0f766e; }
    @media (prefers-color-scheme: dark) { :root { --bg: #111417; --panel: #181d22; --line: #303842; --text: #e5e7eb; --accent: #2dd4bf; } }
    body { margin: 0; min-height: 100vh; display: grid; place-items: center; font-family: Inter, ui-sans-serif, system-ui, -apple-system, Segoe UI, sans-serif; background: var(--bg); color: var(--text); }
    form { width: min(380px, calc(100vw - 32px)); background: var(--panel); border: 1px solid var(--line); border-radius: 8px; padding: 22px; }
    h1 { font-size: 20px; margin: 0 0 18px; }
    label { display: block; font-size: 13px; margin: 12px 0 6px; }
    input, button { width: 100%; border: 1px solid var(--line); border-radius: 6px; padding: 10px 12px; background: var(--panel); color: var(--text); }
    button { margin-top: 16px; background: var(--accent); border-color: var(--accent); color: #fff; cursor: pointer; }
    .error { color: #dc2626; min-height: 20px; font-size: 13px; }
  </style>
</head>
<body>
  <form id="login">
    <h1>Browser Monitor</h1>
    <label for="email">Email</label>
    <input id="email" type="email" autocomplete="username" required>
    <label for="password">Password</label>
    <input id="password" type="password" autocomplete="current-password" required>
    <button type="submit">Sign in</button>
    <p class="error" id="error"></p>
  </form>
  <script>
    login.onsubmit = async (event) => {
      event.preventDefault();
      const response = await fetch('/api/auth/login', {
        method: 'POST',
        headers: {'Content-Type': 'application/json'},
        body: JSON.stringify({email: email.value, password: password.value})
      });
      if (response.ok) location.href = '/';
      else error.textContent = 'Invalid credentials.';
    };
  </script>
</body>
</html>
